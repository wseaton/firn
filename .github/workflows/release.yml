name: Release binaries

# Builds the `firn` CLI for each platform and attaches the archives to the
# GitHub release for the tag, creating the release if it does not exist.
# Runs on `v*` and `cli-v*` tag pushes or by hand with the tag name.

on:
  push:
    tags:
      - "v*"
      - "cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.17.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: release exists
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) tag="${{ github.event.inputs.tag }}" ;;
            *) tag="${GITHUB_REF_NAME}" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create the release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $tag exists"
          else
            case "$tag" in
              cli-v*) title="firn-cli ${tag#cli-v}" ;;
              *)      title="firn ${tag#v}" ;;
            esac
            gh release create "$tag" -R "${{ github.repository }}" --title "$title" --generate-notes --verify-tag
          fi

  build:
    name: ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p firn-cli --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          version=$(cargo pkgid -p firn-cli | sed -E 's/.*[#@]([0-9].*)/\1/')
          name="firn-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp firn-cli/README.md LICENSE "dist/${name}/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/firn.exe" "dist/${name}/"
            (cd dist && 7z a -tzip "${name}.zip" "${name}" >/dev/null)
            echo "asset=dist/${name}.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/${{ matrix.target }}/release/firn" "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            echo "asset=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" "${{ steps.package.outputs.asset }}" --clobber

  checksums:
    name: checksums
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Write SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl && cd dl
          gh release download "${{ needs.prepare.outputs.tag }}" -R "${{ github.repository }}" -p 'firn-*'
          sha256sum firn-* > SHA256SUMS
          gh release upload "${{ needs.prepare.outputs.tag }}" SHA256SUMS -R "${{ github.repository }}" --clobber
